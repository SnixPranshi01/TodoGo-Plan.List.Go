<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}"/>

</head>
<body>
   
    <form action="" method="POST">
        {% csrf_token %}
        <h1>Login</h1>
        <div class="mb-3">
            <label for="username" class="form-label">Username:</label>
            <input type="text" id="username" class="form-control" placeholder="Enter your username" name="username">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password:</label>
            <input type="password" id="password" class="form-control" placeholder="Enter your password" name="password">
        </div>
        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}
        <button type="submit" class="btn btn-primary">Login</button>
        <a href="{% url 'register' %}" class="create-account-link">Create new account</a>
        <a href="{% url 'forgot_password' %}" class="create-account-link">Forgot password?</a>
    </form>
</body>
</html>
