<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}"/>
</head>
<body>
    <form method="post" class="auth-form">
        {% csrf_token %}
        <h1>Forgot Password</h1>
        <p>Enter your email address and we will help you reset your password.</p>
        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" id="email" class="form-control" placeholder="Enter your email" name="email" required>
        </div>
        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}
        {% if message %}
        <p class="success-message">{{ message }}</p>
        {% endif %}
        <button type="submit" class="btn btn-primary">Send Reset Link</button>
        <a href="{% url 'login' %}" class="create-account-link">Back to login</a>
    </form>
</body>
</html>
