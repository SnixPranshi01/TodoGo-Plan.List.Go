{% extends "index.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<h1>Forget Your Password</h1>
<p>Enter your email address below, to obtain a link to reset your password.</p>
<form action="." method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p><input type="submit" name="email" value="Send Reset Link"></p>
</form>
{% endblock %}
